name: APK de prueba (Android)

# Arma un APK que abre Appsign como app de Android (TWA) y lo deja en Releases → "apk-prueba".
# Se corre a mano desde la pestaña Actions, o solo cuando cambia la carpeta android/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK (ya viene instalado en el runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Compilar
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Nombrar el APK
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/debug/app-debug.apk salida/appsign-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: appsign-prueba-apk
          path: salida/appsign-prueba.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-prueba >/dev/null 2>&1 || gh release create apk-prueba --title "APK de prueba" --notes "APK de prueba de Appsign. Firmado con una llave de PRUEBA (no es la de la tienda). Instalar permitiendo 'orígenes desconocidos'." --prerelease
          gh release upload apk-prueba salida/appsign-prueba.apk --clobber
